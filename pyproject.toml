[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-smoke"
version = "1.0.0"
description = "A lightweight OpenAPI specification validator and automated smoke testing CLI."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ali Saleh"}
]
keywords = ["openapi", "swagger", "testing", "smoke-test", "api-quality", "ci-cd"]
dependencies = [
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.scripts]
openapi-smoke = "openapi_smoke.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
