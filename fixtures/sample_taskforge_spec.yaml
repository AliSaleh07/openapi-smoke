openapi: 3.1.0
info:
  title: TaskForge API
  version: 1.0.0
  description: Secure Task Management API specification

paths:
  /healthz:
    get:
      summary: Health Check
      tags:
        - System
      responses:
        '200':
          description: Service is healthy

  /api/v1/auth/me:
    get:
      summary: Get Current User Profile
      tags:
        - Auth
      responses:
        '200':
          description: User profile details
        '401':
          description: Unauthorized

  /api/v1/tasks/{task_id}:
    get:
      summary: Get Task By ID
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task retrieved
        '404':
          description: Task not found
